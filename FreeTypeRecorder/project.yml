name: FreeTypeRecorder
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  FreeTypeRecorder:
    type: application
    platform: iOS
    sources:
      - path: FreeTypeRecorder
      - path: Shared
    dependencies:
      - target: BroadcastExtension
        embed: true
    entitlements:
      path: FreeTypeRecorder.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jimmyx.freetyperecorder
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Record a segmented front-camera video of your face and shoulders while you type, for typing-posture research."
        NSMotionUsageDescription: "Record device motion to study how holding hand affects typing."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        DEVELOPMENT_TEAM: P2LUTF8N6F
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: jimmyx.freetyperecorder
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      - path: Shared
    entitlements:
      path: BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jimmyx.freetyperecorder
    info:
      path: BroadcastExtension/Generated-Info.plist
      properties:
        # iOS rejects app-extension install without a non-empty
        # CFBundleDisplayName — this is the name shown in the broadcast
        # picker sheet.
        CFBundleDisplayName: "FreeTypeRecorder"
        # Full-screen (sample-buffer) upload extension — receives the entire
        # display's frames, including the system keyboard, unlike the main
        # app's in-app RPScreenRecorder.startCapture.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        DEVELOPMENT_TEAM: P2LUTF8N6F
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: jimmyx.freetyperecorder.broadcast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  FreeTypeRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FreeTypeRecorderTests
      - path: FreeTypeRecorder/Logic
      - path: FreeTypeRecorder/Models/HoldingHand.swift
    settings:
      base:
        DEVELOPMENT_TEAM: P2LUTF8N6F
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  FreeTypeRecorder:
    build:
      targets:
        FreeTypeRecorder: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FreeTypeRecorderTests
